<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" role="img" aria-label="Three AIs forget separately; one shared notebook remembers after you approve.">
  <rect width="960" height="400" fill="#f6f8fa"/>
  <rect x="16" y="16" width="452" height="368" rx="16" fill="#ffffff" stroke="#d0d7de"/>
  <rect x="492" y="16" width="452" height="368" rx="16" fill="#ffffff" stroke="#1a7f37"/>

  <text x="242" y="52" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#656d76">Today</text>
  <text x="718" y="52" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#1a7f37">With one notebook</text>

  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#24292f">
    <rect x="44" y="80" width="120" height="44" rx="8" fill="#ddf4ff" stroke="#54aeff"/>
    <text x="104" y="107" text-anchor="middle">Cursor</text>
    <rect x="44" y="148" width="120" height="44" rx="8" fill="#ddf4ff" stroke="#54aeff"/>
    <text x="104" y="175" text-anchor="middle">Claude</text>
    <rect x="44" y="216" width="120" height="44" rx="8" fill="#ddf4ff" stroke="#54aeff"/>
    <text x="104" y="243" text-anchor="middle">Codex</text>

    <rect x="220" y="80" width="220" height="44" rx="8" fill="#fff8c5" stroke="#d4a72c"/>
    <text x="330" y="107" text-anchor="middle">remembers A</text>
    <rect x="220" y="148" width="220" height="44" rx="8" fill="#fff8c5" stroke="#d4a72c"/>
    <text x="330" y="175" text-anchor="middle">remembers B</text>
    <rect x="220" y="216" width="220" height="44" rx="8" fill="#ffebe9" stroke="#ff8182"/>
    <text x="330" y="243" text-anchor="middle">remembers nothing</text>
  </g>
  <text x="242" y="312" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#656d76">New chat. Different AI. Same amnesia.</text>
  <text x="242" y="338" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#656d76">You explain the decision again.</text>

  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#24292f">
    <rect x="520" y="80" width="100" height="36" rx="8" fill="#ddf4ff" stroke="#54aeff"/>
    <text x="570" y="103" text-anchor="middle">Cursor</text>
    <rect x="520" y="128" width="100" height="36" rx="8" fill="#ddf4ff" stroke="#54aeff"/>
    <text x="570" y="151" text-anchor="middle">Claude</text>
    <rect x="520" y="176" width="100" height="36" rx="8" fill="#ddf4ff" stroke="#54aeff"/>
    <text x="570" y="199" text-anchor="middle">Codex</text>

    <path d="M632 98 H700" stroke="#1a7f37" stroke-width="2"/>
    <path d="M632 146 H700" stroke="#1a7f37" stroke-width="2"/>
    <path d="M632 194 H700" stroke="#1a7f37" stroke-width="2"/>

    <rect x="700" y="86" width="216" height="124" rx="10" fill="#dafbe1" stroke="#1a7f37"/>
    <text x="808" y="124" text-anchor="middle" font-size="16" font-weight="700">one markdown vault</text>
    <text x="808" y="150" text-anchor="middle">you can open and search</text>
    <text x="808" y="176" text-anchor="middle">every AI reads the same page</text>

    <rect x="700" y="230" width="216" height="56" rx="10" fill="#1a7f37"/>
    <text x="808" y="264" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="700">you approve the write</text>
  </g>
  <text x="718" y="320" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1a7f37">Agents may propose. They do not write first.</text>
  <text x="718" y="346" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1a7f37">Wrong memory never becomes fact.</text>
</svg>
