<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" aria-label="Same decision with and without a shared notebook">
  <rect width="960" height="420" fill="#f4efe6"/>
  <rect x="16" y="16" width="452" height="388" rx="14" fill="#fffdf8" stroke="#d6d0c4"/>
  <rect x="492" y="16" width="452" height="388" rx="14" fill="#fffdf8" stroke="#3f6212"/>
  <text x="242" y="52" text-anchor="middle" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="16" font-weight="700" fill="#9f1239">周三 · 没有这本笔记</text>
  <text x="718" y="52" text-anchor="middle" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="16" font-weight="700" fill="#3f6212">周三 · 有这本笔记</text>
  <g font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="14">
    <rect x="36" y="76" width="412" height="52" rx="8" fill="#ffe4e6"/>
    <text x="52" y="98" fill="#9f1239">Claude</text>
    <text x="52" y="118" fill="#1c1917">安装包放哪？Downloads 可以吗？</text>
    <rect x="36" y="140" width="412" height="72" rx="8" fill="#f5f5f4"/>
    <text x="52" y="162" fill="#57534e">林可</text>
    <text x="52" y="182" fill="#1c1917">周一刚跟 Cursor 说过。</text>
    <text x="52" y="202" fill="#1c1917">放 E:/Apps。你怎么又问。</text>
    <rect x="36" y="224" width="412" height="52" rx="8" fill="#ffe4e6"/>
    <text x="52" y="246" fill="#9f1239">Claude</text>
    <text x="52" y="266" fill="#1c1917">好，我按 Downloads 来？</text>
    <text x="242" y="368" text-anchor="middle" fill="#9f1239">记错的，会接着用。</text>
  </g>
  <g font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="14">
    <rect x="512" y="76" width="412" height="72" rx="8" fill="#ecfccb"/>
    <text x="528" y="98" fill="#3f6212">Claude</text>
    <text x="528" y="118" fill="#1c1917">读了 MEMORY.md → install-path。</text>
    <text x="528" y="138" fill="#1c1917">新软件放 E:/Apps。现在装吗？</text>
    <rect x="512" y="160" width="412" height="52" rx="8" fill="#f5f5f4"/>
    <text x="528" y="182" fill="#57534e">林可</text>
    <text x="528" y="202" fill="#1c1917">装。别改回 Downloads。</text>
    <rect x="512" y="224" width="412" height="72" rx="8" fill="#ecfccb"/>
    <text x="528" y="246" fill="#3f6212">Claude</text>
    <text x="528" y="266" fill="#1c1917">不会。那篇笔记写着：不要</text>
    <text x="528" y="286" fill="#1c1917">“帮忙”改回 Downloads。</text>
    <text x="718" y="368" text-anchor="middle" fill="#3f6212">写过的，下场还能用。</text>
  </g>
</svg>
