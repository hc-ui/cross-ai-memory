[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "cross-ai-memory"
version = "0.1.1"
description = "One shared notebook for every AI you use. Agents propose; you approve."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "hc-ui" }]
keywords = ["ai-memory", "obsidian", "agents", "cursor", "claude-code", "local-first"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Text Processing",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
aimem = "aimem.cli:main"

[project.urls]
Homepage = "https://github.com/hc-ui/cross-ai-memory"
Issues = "https://github.com/hc-ui/cross-ai-memory/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/aimem"]

[tool.hatch.build.targets.wheel.force-include]
"starter" = "aimem/data/starter"
"adapters" = "aimem/data/adapters"
"tools/weekly-proposal-prompt.md" = "aimem/data/weekly-proposal-prompt.md"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
